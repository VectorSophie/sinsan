[project]
name = "sinsan-training"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "pyffish>=0.0.89",
  # Pinned to the CUDA 12.8 build: supports Blackwell (sm_120) and is already in the local uv cache,
  # which matters on this host's slow network.
  "torch==2.9.1",
  "numpy>=2.0",
  "maturin>=1.7",
]

[tool.uv]
package = false
